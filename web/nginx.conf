server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le front et l'API sont servis sur la même origine. Deux effets : plus
    # aucune question de CORS dans le navigateur, et rien à reconfigurer entre
    # le poste de développement et le conteneur.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # ⚠️ Indispensable au streaming. Par défaut nginx accumule la réponse
        # amont et la livre d'un bloc : la réponse arriverait entière à la fin,
        # sans qu'aucune erreur n'apparaisse nulle part. La panne la plus
        # difficile à diagnostiquer est celle qui ressemble à un succès lent.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Une réponse de modèle peut prendre une minute. Le défaut de 60 s
        # couperait le flux en pleine phrase sur les questions les plus longues.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
