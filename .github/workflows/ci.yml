name: CI

# La CI protège trois choses, dans cet ordre d'importance :
#   1. les agrégations sont justes — c'est là que vit la valeur du produit ;
#   2. la taille des sorties d'outils reste bornée — l'invariant qui protège
#      la fenêtre de contexte, et qui se dégraderait sans surveillance ;
#   3. la pile démarre vraiment avec docker compose.
#
# Les tests marqués `live` ne tournent PAS ici : ils dépendent d'un service
# public tiers, et une CI qui rougit parce qu'un serveur externe redémarre
# n'apprend plus rien à personne. Ils sont lancés à la main avant le rendu.

on:
  # Les deux noms de branche : le dépôt est sur master, mais un clone poussé
  # ailleurs peut être sur main. Ne déclencher que sur l'un des deux ferait une
  # CI silencieuse, c'est-à-dire pire qu'une CI absente — on croirait qu'elle
  # passe alors qu'elle ne tourne pas.
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests et analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Lu depuis go.mod plutôt qu'écrit en dur : une version figée ici
          # finit toujours par diverger de celle qu'exige le module, et le
          # message d'erreur qui en résulte parle de dépendances, pas de CI.
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Dépendances vérifiées
        working-directory: api
        run: |
          go mod download
          # Échoue si go.mod ou go.sum ne sont pas à jour : une dépendance
          # ajoutée sans être committée casse le build de tout le monde sauf
          # celui qui l'a ajoutée.
          go mod verify

      - name: Formatage
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: Analyse statique
        working-directory: api
        run: go vet ./...

      # staticcheck va plus loin que go vet : code mort, comparaisons toujours
      # vraies, mauvais usages de la bibliotheque standard, conversions
      # inutiles. Il passe a zero avertissement, et l'ajouter maintenant fige ce
      # niveau plutot que de le laisser se degrader en silence.
      - name: Analyse statique approfondie
        working-directory: api
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      # Vulnerabilites connues des dependances. govulncheck ne signale que ce
      # que le code APPELLE reellement, pas tout ce qui traine dans go.sum : sur
      # 42 vulnerabilites presentes dans l'arbre, 3 seulement etaient atteintes,
      # et ce sont celles-la qu'on a corrigees.
      #
      # En CI parce qu'une dependance saine aujourd'hui ne l'est pas demain, et
      # que personne ne relance un scan de securite spontanement.
      - name: Vulnérabilités des dépendances
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Tests avec détecteur de compétition
        working-directory: api
        # -race est essentiel ici : le cache est lu par plusieurs requêtes
        # simultanées, et une compétition sur le snapshot partagé ne se
        # manifesterait qu'en production, de façon intermittente.
        run: go test -race -count=1 ./...

      - name: Couverture
        working-directory: api
        run: |
          go test -coverprofile=cover.out ./internal/... > /dev/null
          go tool cover -func=cover.out | tail -1

      # Les chiffres du README sont recalcules et compares. Ils ont change une
      # dizaine de fois pendant le projet, et chaque changement est une occasion
      # d'en laisser un derriere. Un chiffre faux coute plus que son erreur : un
      # lecteur qui en attrape un cesse de faire confiance aux autres.
      - name: Cohérence de la documentation
        run: python audit/coherence_doc.py

      # Le front n'a ni build ni dependance, et ses tests non plus : Node est
      # deja present sur le runner, le fichier n'importe rien. Il verifie la
      # propriete qui compte — la sortie du modele ne peut jamais devenir du
      # balisage — sur six charges d'injection reelles.
      - name: Tests du rendu front
        run: node web/rendu_test.mjs

  build:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construction des images
        env:
          # docker-compose.yml utilise l'opérateur :? sur OPENAI_API_KEY, qui
          # fait échouer TOUTE commande compose — y compris `build` — quand la
          # variable est absente. Sans cette ligne le job échouait dès le
          # premier pas, avant même de construire quoi que ce soit.
          OPENAI_API_KEY: ci-dummy-key
        run: docker compose build

      - name: La pile démarre et répond
        env:
          # Clé factice : on vérifie que le service démarre et que sa route de
          # santé répond, pas qu'il sait parler à un modèle.
          OPENAI_API_KEY: ci-dummy-key
        run: |
          docker compose up -d postgres api
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "API en ligne après ${i}s"
              curl -s http://localhost:8080/api/health
              exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas répondu en 40 s :"
          docker compose logs api
          exit 1

      # La pile tourne déjà : autant l'interroger vraiment plutôt que de se
      # contenter de sa route de santé. Ces tests couvrent le cycle de vie
      # complet d'une conversation, l'isolation entre utilisateurs et la forme
      # du flux SSE — soit toute la surface publique du service.
      #
      # Ils tournent avec la clé factice : le seul test qui appelle le modèle
      # vérifie que l'échec reste actionnable, ce qui est précisément ce qu'on
      # veut savoir quand une clé est mauvaise.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Tests d'intégration
        working-directory: api
        run: go test -tags=integration -count=1 -v ./internal/httpapi/

      # Les audits deviennent continus au lieu d'être un exercice ponctuel.
      # Seules les parties qui n'appellent PAS le modèle tournent ici : elles ne
      # coûtent aucun jeton et se contentent de la clé factice.
      #
      # Un audit qu'on ne relance jamais documente l'état du code le jour où on
      # l'a écrit, rien de plus. Ces deux-là ont trouvé cinq failles réelles ;
      # les brancher sur la CI est ce qui empêche la sixième de passer.
      - name: Audit adverse — couche HTTP
        run: python audit/attaques_api.py

      - name: Audit de comportements
        run: python audit/comportements.py --rapide

      # 44 vecteurs d'injection : SQL, traversee de chemin, commande, JSON,
      # en-tetes, Unicode, SSRF. Aucun n'appelle le modele.
      - name: Matrice d'injections
        run: python audit/injections.py

      # L'exigence de la spécification que rien ne rejouait : « on arrete la stack, on la
      # relance, tout est encore la ». Ce script DETRUIT les conteneurs entre
      # deux lectures — un simple restart ne prouverait rien, PostgreSQL ne
      # bougeant pas.
      #
      # Il a besoin de compose, donc de la cle factice, pour les memes raisons
      # que les deux etapes ci-dessous. Et il tourne en mode degrade ici : sans
      # vrai modele, il verifie la survie de la conversation mais pas celle du
      # CONTENU des messages. Il le DIT dans sa sortie plutot que de rendre un
      # vert qui laisserait croire le contraire.
      #
      # En dernier des audits : il coupe la pile, donc rien ne doit suivre qui
      # en ait besoin.
      - name: Persistance à travers un arrêt complet
        env:
          OPENAI_API_KEY: ci-dummy-key
        run: python audit/persistance.py

      # ⚠️ CES DEUX ETAPES ONT BESOIN DE LA CLE, ELLES AUSSI.
      #
      # docker-compose.yml utilise l'operateur :? sur OPENAI_API_KEY, qui fait
      # echouer TOUTE commande compose quand la variable manque — y compris
      # `logs` et `down`, qui ne demarrent pourtant rien.
      #
      # Le piege etait deja documente plus haut pour `build`, et je l'ai quand
      # meme reintroduit ici : la CI passait tous ses tests puis rougissait sur
      # le menage. Un rouge de fin de job qui ne dit rien sur le code est le
      # genre de rouge qu'on apprend a ignorer, et c'est ainsi qu'on rate le
      # vrai.
      - name: Journaux en cas d'échec
        if: failure()
        env:
          OPENAI_API_KEY: ci-dummy-key
        run: docker compose logs --tail 100

      - name: Arrêt de la pile
        if: always()
        env:
          OPENAI_API_KEY: ci-dummy-key
        run: docker compose down -v
